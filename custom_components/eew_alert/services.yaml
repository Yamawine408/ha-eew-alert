cast_alert:
  name: 警告画像をキャスト
  description: 警告画像を生成し、指定したChromecastデバイスにキャストします。省略した項目は直近に受信した地震速報の値が使われます。
  fields:
    device_name:
      name: デバイス名
      description: キャスト先Chromecastデバイスのフレンドリー名。省略時は統合設定のデフォルトを使用。
      example: "寝室"
      selector:
        text:
    label:
      name: 震度ラベル
      description: "表示する震度(例:5強)。テスト用。"
      example: "5強"
      selector:
        text:
    hypocenter:
      name: 震源地
      description: 表示する震源地名。テスト用。
      example: "テスト震源"
      selector:
        text:
